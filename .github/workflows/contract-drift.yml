name: Contract drift

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.1"
      - name: Compare with canonical main contract
        run: |
          scripts/download-openapi.rb \
            https://docs.viapost.io/openapi/public.yaml \
            /tmp/viapost-public.yaml
          VIAPOST_OPENAPI_SOURCE=/tmp/viapost-public.yaml scripts/check-openapi.sh
