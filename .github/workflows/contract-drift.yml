name: Contract drift

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "3.1"
      - name: Compare with canonical main contract
        run: |
          scripts/download-openapi.rb \
            https://docs.viapost.io/openapi/public.yaml \
            /tmp/viapost-public.yaml
          VIAPOST_OPENAPI_SOURCE=/tmp/viapost-public.yaml scripts/check-openapi.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
