name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0.x", "10.0.x"]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            ${{ matrix.dotnet }}
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.1"
      - run: scripts/check-openapi.sh
        env:
          VIAPOST_CONTRACT_SOURCE_TOKEN: ${{ secrets.VIAPOST_CONTRACT_SOURCE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: scripts/test-openapi-checker.sh
      - run: scripts/test-openapi-downloader.rb
      - run: dotnet restore ViaPost.sln --locked-mode
      - run: dotnet build ViaPost.sln --configuration Release --no-restore
      - run: dotnet test ViaPost.sln --configuration Release --no-build
      - run: dotnet pack src/ViaPost/ViaPost.csproj --configuration Release --no-build --output artifacts
      - name: Verify isolated package consumer
        run: |
          mkdir -p "${RUNNER_TEMP}/consumer"
          cd "${RUNNER_TEMP}/consumer"
          dotnet new console --framework net8.0
          version="$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' "${GITHUB_WORKSPACE}/src/ViaPost/ViaPost.csproj")"
          dotnet add package ViaPost --version "$version" --source "${GITHUB_WORKSPACE}/artifacts"
          printf '%s\n' 'using ViaPost; using var client = new ViaPostClient("vp_test_consumer"); Console.WriteLine(client.Usage is not null);' > Program.cs
          dotnet run --no-restore
